<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гоша Eternal Blessing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #1a0a2e 0%, #0a0a0a 60%, #000 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: crosshair;
    user-select: none;
  }

  .card {
    position: relative;
    z-index: 10;
    padding: 48px 64px;
    border: 1px solid rgba(255, 60, 90, 0.35);
    border-radius: 18px;
    background: rgba(20, 5, 20, 0.55);
    backdrop-filter: blur(14px);
    box-shadow: 0 0 60px rgba(255, 40, 80, 0.18), inset 0 0 40px rgba(255, 40, 80, 0.06);
    text-align: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card.shake {
    animation: shake 0.45s cubic-bezier(.36,.07,.19,.97);
  }

  @keyframes shake {
    10%, 90% { transform: translate(-2px, 0) rotate(-0.5deg); }
    20%, 80% { transform: translate(4px, 0) rotate(0.8deg); }
    30%, 50%, 70% { transform: translate(-8px, 0) rotate(-1.2deg); }
    40%, 60% { transform: translate(8px, 0) rotate(1.2deg); }
  }

  h1 {
    font-size: clamp(22px, 4vw, 40px);
    color: #ffd9e0;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(255, 60, 100, 0.7);
    margin-bottom: 14px;
  }

  .name {
    color: #ff4d6d;
    font-weight: 800;
    background: linear-gradient(90deg, #ff4d6d, #ff9a3d, #ff4d6d);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .sub {
    font-size: clamp(12px, 1.6vw, 16px);
    color: rgba(255, 200, 210, 0.55);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .btn {
    margin-top: 34px;
    padding: 14px 38px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(135deg, #ff2d55, #b0003a);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(255, 45, 85, 0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:hover { transform: scale(1.06); box-shadow: 0 0 40px rgba(255, 45, 85, 0.9); }
  .btn:active { transform: scale(0.96); }

  .counter {
    margin-top: 18px;
    font-size: 13px;
    color: rgba(255, 200, 210, 0.4);
    letter-spacing: 1px;
  }

  .counter b { color: #ff4d6d; }

  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    border-radius: 50%;
    will-change: transform, opacity;
  }

  .floater {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    font-weight: 800;
    white-space: nowrap;
    color: #ff4d6d;
    text-shadow: 0 0 12px rgba(255, 45, 85, 0.9);
    animation: floatUp 1.4s ease-out forwards;
  }

  @keyframes floatUp {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    20%  { opacity: 1; transform: translate(-50%, -70%) scale(1.1); }
    100% { transform: translate(-50%, -200%) scale(0.9); opacity: 0; }
  }

  .glow-ring {
    position: fixed;
    pointer-events: none;
    z-index: 4;
    border-radius: 50%;
    border: 2px solid rgba(255, 60, 90, 0.6);
    animation: ringOut 0.7s ease-out forwards;
  }

  @keyframes ringOut {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <h1>Гоша <span class="name">Eternal Blessing</span> — хуесос</h1>
  <p class="sub">официально подтверждено</p>
  <button class="btn" id="btn">Нажми, чтобы подтвердить</button>
  <p class="counter">подтверждений: <b id="count">0</b></p>
</div>

<script>
(function () {
  const card  = document.getElementById('card');
  const btn   = document.getElementById('btn');
  const count = document.getElementById('count');

  let clicks = 0;

  const PHRASES = [
    'подтверждено',
    'и это факт',
    'гоша, ты слышал?',
    '100% хуесос',
    'eternal blessing? нет',
    'аксиома',
    'не оспаривается',
  ];

  const COLORS = ['#ff4d6d', '#ff9a3d', '#ff2d55', '#ffd9e0', '#b0003a', '#ff6b9a'];

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  function burst(x, y) {
    const n = 22;
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = rand(4, 11);
      const color = pick(COLORS);
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = color;
      p.style.boxShadow = '0 0 ' + (size * 2) + 'px ' + color;
      document.body.appendChild(p);

      const ang = rand(0, Math.PI * 2);
      const dist = rand(60, 220);
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist;

      p.animate(
        [
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
        ],
        { duration: rand(600, 1100), easing: 'cubic-bezier(.2,.8,.3,1)' }
      ).onfinish = () => p.remove();
    }

    const ring = document.createElement('div');
    ring.className = 'glow-ring';
    const d = 90;
    ring.style.width = d + 'px';
    ring.style.height = d + 'px';
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    document.body.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove());
  }

  function floater(x, y, text) {
    const f = document.createElement('div');
    f.className = 'floater';
    f.textContent = text;
    f.style.left = x + 'px';
    f.style.top = y + 'px';
    f.style.fontSize = rand(14, 26) + 'px';
    document.body.appendChild(f);
    f.addEventListener('animationend', () => f.remove());
  }

  function confirmAt(x, y) {
    clicks++;
    count.textContent = clicks;
    burst(x, y);
    floater(x, y, pick(PHRASES));
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');

    document.body.animate(
      [
        { filter: 'brightness(1) hue-rotate(0deg)' },
        { filter: 'brightness(1.35) hue-rotate(-15deg)' },
        { filter: 'brightness(1) hue-rotate(0deg)' }
      ],
      { duration: 220 }
    );
  }

  btn.addEventListener('click', (e) => {
    const r = btn.getBoundingClientRect();
    confirmAt(r.left + r.width / 2, r.top + r.height / 2);
  });

  document.addEventListener('click', (e) => {
    if (e.target === btn) return;
    confirmAt(e.clientX, e.clientY);
  });

  document.addEventListener('mousemove', (e) => {
    if (Math.random() > 0.12) return;
    const p = document.createElement('div');
    p.className = 'particle';
    const size = rand(2, 5);
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = e.clientX + 'px';
    p.style.top = e.clientY + 'px';
    p.style.background = pick(COLORS);
    p.style.opacity = '0.7';
    document.body.appendChild(p);
    p.animate(
      [
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 0.7 },
        { transform: 'translate(-50%, -50%) scale(0)', opacity: 0 }
      ],
      { duration: 700, easing: 'ease-out' }
    ).onfinish = () => p.remove();
  });
})();
</script>
</body>
</html>
